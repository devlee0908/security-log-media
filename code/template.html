<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--acc:#2BFF88;--acc-ink:#00A060;--bg:#0A0E14;--ink:#111418;--sub:#3A4048;--red:#FF4D5E}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Noto Sans CJK KR',sans-serif;background:#fff;color:var(--ink)}
#slide{position:relative;width:1080px;height:1350px;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.mono{font-family:'DejaVu Sans Mono',monospace}
/* content slide */
.media{position:absolute;left:0;top:0;width:1080px;height:794px;background:var(--bg)}
.badge{position:absolute;left:54px;top:752px;width:84px;height:84px;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px;color:rgba(70,78,90,.85);background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.18));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1.5px solid rgba(255,255,255,.7);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -10px 18px rgba(255,255,255,.12),0 8px 24px rgba(10,14,20,.28)}
.text{position:absolute;left:89px;right:80px;top:866px}
.text h1{font-weight:800;font-size:80px;line-height:1.22;letter-spacing:-2px;white-space:pre-line}
.text p{margin-top:34px;font-size:36px;line-height:1.32;color:var(--sub);letter-spacing:-.6px;word-break:keep-all}
.text p b{color:var(--acc-ink);font-weight:700}
/* cover */
.cover{background:var(--bg);color:#fff}
.tag{position:absolute;left:64px;top:842px;font-family:'DejaVu Sans Mono',monospace;font-size:36px;font-weight:700;color:#8A94A6;letter-spacing:.5px}
.tag b{margin-right:18px}
.cover h1{position:absolute;left:64px;right:64px;top:914px;font-size:96px;font-weight:900;line-height:1.22;letter-spacing:-2px;white-space:pre-line}
.cover h1 b{color:var(--cat,var(--acc))}
.logo{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-weight:900;font-size:30px;letter-spacing:4px;color:#fff}
.logo i{font-style:normal;color:var(--acc)}
.shade{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(transparent,var(--bgs,rgba(10,14,20,.92)) 45%,var(--bg))}
/* static slides */
.plain{background:#F4F7F9 linear-gradient(#E3E8EE 1px,transparent 1px) 0 0/54px 54px,#F4F7F9;}
.plain .gridv{position:absolute;inset:0;background:linear-gradient(90deg,#E3E8EE 1px,transparent 1px) 0 0/54px 54px}
.center{position:absolute;left:64px;right:64px;text-align:center}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 40px rgba(20,30,50,.10);padding:48px 56px;text-align:left}
.sum li{list-style:none;font-size:40px;line-height:1.5;font-weight:500;padding:22px 0 22px 64px;position:relative;border-bottom:2px solid #EEF1F4;word-break:keep-all}
.sum li:last-child{border:0}
.sum li span{position:absolute;left:0;top:26px;width:44px;height:44px;border-radius:12px;background:var(--bg);color:var(--acc);font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center}
.src{font-size:26px;color:#7A818B;line-height:1.6}
.btn{display:inline-block;background:#0A84FF;color:#fff;font-weight:700;border-radius:18px}
</style></head>
<body><div id="slide"></div>
<script>
const W=1080, MH=740, ACC='#2BFF88', RED='#FF4D5E', FONT="'Noto Sans CJK KR',sans-serif", MONO="'DejaVu Sans Mono',monospace";
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const hl=s=>s.replace(/\[(.+?)\]/g,'<b>$1</b>');
let ctx, draw=()=>{}, PIMG=null;

function mkCanvas(h){const c=document.createElement('canvas');c.width=W;c.height=h;document.getElementById('slide').appendChild(c);return c.getContext('2d')}
// cover background mood per category (dark, tinted)
const THEME={NEWS:{a:'#05120D',b:'#0B2419',glow:'rgba(43,255,136,.20)',line:'rgba(43,255,136,.07)'},CVE:{a:'#14060A',b:'#2A0B12',glow:'rgba(255,77,94,.24)',line:'rgba(255,77,94,.08)'},TREND:{a:'#140A04',b:'#2B1608',glow:'rgba(255,138,61,.22)',line:'rgba(255,138,61,.08)'},TIPS:{a:'#121004',b:'#262008',glow:'rgba(255,200,61,.20)',line:'rgba(255,200,61,.07)'},WEEKLY:{a:'#050E1A',b:'#0B1D33',glow:'rgba(90,176,255,.22)',line:'rgba(90,176,255,.08)'},WORDS:{a:'#0D0718',b:'#1C0F30',glow:'rgba(180,140,255,.22)',line:'rgba(180,140,255,.08)'}};
let BGT=null;
function grid(g,h){if(BGT)return bgPro(g,h);g.fillStyle='#0A0E14';g.fillRect(0,0,W,h);g.strokeStyle='rgba(43,255,136,.06)';g.lineWidth=1;for(let x=0;x<W;x+=54){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=54){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}
function rnd(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

function glow(g,x,y,r,c){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function phone(g,cx,cy,dx=0){ // returns screen rect
 const w=340,h=640,x=cx-w/2+dx,y=cy-h/2;
 g.fillStyle='#1B2330';rr(g,x,y,w,h,52);g.fill();g.strokeStyle='#3A4555';g.lineWidth=6;g.stroke();
 g.fillStyle='#0F141B';rr(g,x+16,y+16,w-32,h-32,40);g.fill();
 g.fillStyle='#000';rr(g,cx+dx-50,y+30,100,26,13);g.fill();
 return {x:x+16,y:y+16,w:w-32,h:h-32,cx:cx+dx};
}
function txt(g,s,x,y,size,color,weight=700,font=FONT,align='center'){g.font=`${weight} ${size}px ${font}`;g.fillStyle=color;g.textAlign=align;g.fillText(s,x,y);g.textAlign='left'}
// ---- premium helpers ----
function bgPro(g,h,tint){ // layered dark bg: gradient + fine dot-grid + vignette
 const vg=g.createLinearGradient(0,0,W,h);if(BGT){vg.addColorStop(0,BGT.b);vg.addColorStop(.6,BGT.a);vg.addColorStop(1,'#050608')}else{vg.addColorStop(0,'#0C1119');vg.addColorStop(.55,'#0A0E14');vg.addColorStop(1,'#070A0F')}g.fillStyle=vg;g.fillRect(0,0,W,h);
 if(BGT){const am=g.createRadialGradient(W*0.5,h*0.28,0,W*0.5,h*0.28,W*0.85);am.addColorStop(0,BGT.glow);am.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=am;g.fillRect(0,0,W,h)}
 if(tint){const gl=g.createRadialGradient(W/2,h*0.42,0,W/2,h*0.42,W*0.72);gl.addColorStop(0,tint);gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,W,h)}
 g.fillStyle='rgba(120,140,170,.05)';for(let x=36;x<W;x+=48)for(let y=36;y<h;y+=48){g.beginPath();g.arc(x,y,1.3,0,7);g.fill()}
 const vn=g.createRadialGradient(W/2,h/2,h*0.3,W/2,h/2,h*0.72);vn.addColorStop(0,'rgba(0,0,0,0)');vn.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=vn;g.fillRect(0,0,W,h);
}
function withShadow(g,color,blur,dy,fn){g.save();g.shadowColor=color;g.shadowBlur=blur;g.shadowOffsetY=dy;fn();g.restore()}
function hx(c,a){const n=parseInt(c.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function panel(g,x,y,w,hh,r,accent){ // elevated glass card with top sheen + accent edge
 withShadow(g,'rgba(0,0,0,.5)',34,18,()=>{const gr=g.createLinearGradient(0,y,0,y+hh);gr.addColorStop(0,'#1A212C');gr.addColorStop(1,'#141A23');g.fillStyle=gr;rr(g,x,y,w,hh,r);g.fill()});
 g.strokeStyle=accent?hx(accent,.5):'rgba(255,255,255,.09)';g.lineWidth=2;rr(g,x,y,w,hh,r);g.stroke();
 const sh=g.createLinearGradient(0,y,0,y+3);g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1.5;rr(g,x+1,y+1,w-2,hh-2,r-1);g.stroke();
}
function nodeBadge(g,x,y,w,hh,accent,on){ // pill for a data node
 const r=hh/2;withShadow(g,on?hx(accent,.5):'rgba(0,0,0,.45)',on?26:16,10,()=>{g.fillStyle='#141A22';rr(g,x,y,w,hh,r);g.fill()});
 withShadow(g,'rgba(0,0,0,0)',0,0,()=>{const gr=g.createLinearGradient(0,y,0,y+hh);
  if(on){gr.addColorStop(0,hx(accent,.28));gr.addColorStop(1,hx(accent,.12))}else{gr.addColorStop(0,'#1B222D');gr.addColorStop(1,'#141A22')}g.fillStyle=gr;rr(g,x,y,w,hh,r);g.fill()});
 g.strokeStyle=on?accent:'rgba(255,255,255,.12)';g.lineWidth=on?3:2;rr(g,x,y,w,hh,r);g.stroke();
}
function flowLine(g,x1,y1,x2,y2,color,t,speed,on){ // animated dashed energy line
 g.save();g.setLineDash([3,16]);g.lineDashOffset=-t*speed;g.lineCap='round';g.lineWidth=5;g.strokeStyle=hx(color,on?.95:.28);
 if(on){g.shadowColor=hx(color,.6);g.shadowBlur=10}g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();
}
function orb(g,x,y,r,color){withShadow(g,hx(color,.7),28,0,()=>{const gr=g.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);gr.addColorStop(0,hx(color,.9));gr.addColorStop(1,hx(color,.5));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()})}

// ---------- animations: each is (g, t, data) ----------
const ANIM={
 call(g,t,d,h){ // vishing: incoming call -> scam warning
  grid(g,h);glow(g,540,450,520,'rgba(255,77,94,.16)');
  const ring=(t%1.6)<0.9&&t<3.2, dx=ring?Math.sin(t*60)*7:0;
  for(let k=0;k<3;k++){const p=((t*0.8+k/3)%1);g.strokeStyle=`rgba(43,255,136,${(1-p)*0.5})`;g.lineWidth=5;
   [-1,1].forEach(sd=>{g.beginPath();g.arc(540,450,220+p*180,sd>0?-0.5:Math.PI-0.5,sd>0?0.5:Math.PI+0.5);g.stroke()})}
  const s=phone(g,540,450,dx);
  txt(g,'수신 전화',s.cx,s.y+120,26,'#8A94A6',500);
  g.fillStyle='#2A3442';g.beginPath();g.arc(s.cx,s.y+220,62,0,7);g.fill();
  txt(g,d.initial||'?',s.cx,s.y+242,60,'#C9D1DC',900);
  txt(g,d.caller,s.cx,s.y+340,40,'#fff',900);txt(g,d.number,s.cx,s.y+384,24,'#8A94A6',500,MONO);
  [[-80,'#FF4D5E'],[80,'#28C840']].forEach(([o,c])=>{g.fillStyle=c;g.beginPath();g.arc(s.cx+o,s.y+520,40,0,7);g.fill()});
  if(t>3.2){const p=ease((t-3.2)/0.4);g.globalAlpha=p;g.fillStyle='rgba(255,77,94,.95)';rr(g,s.x+10,s.y+150,s.w-20,120,22);g.fill();
   txt(g,'⚠',s.x+44,s.y+226,38,'#fff',900);txt(g,d.warn,s.cx+26,s.y+224,30,'#fff',900);g.globalAlpha=1}
 },
 gauge(g,t,d,h){ // CVSS severity gauge
  grid(g,h);glow(g,540,520,560,'rgba(255,77,94,.14)');
  const cx=540,cy=600,R=330,segs=[['#2BD97C',4],['#FFC83D',7],['#FF8A3D',9],['#FF4D5E',10]];
  let a0=0;segs.forEach(([c,e])=>{g.strokeStyle=c;g.globalAlpha=.35;g.lineWidth=44;g.beginPath();g.arc(cx,cy,R,Math.PI+a0/10*Math.PI,Math.PI+e/10*Math.PI);g.stroke();a0=e});g.globalAlpha=1;
  const v=d.score*ease((t-0.3)/1.8), ang=Math.PI+v/10*Math.PI;
  g.strokeStyle='#FF4D5E';g.lineWidth=44;g.beginPath();g.arc(cx,cy,R,Math.PI,ang);g.stroke();
  g.strokeStyle='#fff';g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(ang)*(R-70),cy+Math.sin(ang)*(R-70));g.stroke();g.lineCap='butt';
  g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,22,0,7);g.fill();
  txt(g,v.toFixed(1),cx,cy-120,150,'#fff',900,MONO);
  txt(g,d.label,cx,170,34,'#C9D1DC',700,MONO);
  if(t>2.2){const pu=0.75+0.25*Math.sin(t*8);g.globalAlpha=pu;g.fillStyle='#FF4D5E';rr(g,cx-150,cy+40,300,74,37);g.fill();g.globalAlpha=1;txt(g,'CRITICAL',cx,cy+92,40,'#fff',900,MONO)}
 },
 ransom(g,t,d,h){ // files getting encrypted
  grid(g,h);
  const cols=4,files=d.files,cw=230,ch=210,x0=540-cols*cw/2,y0=150;
  files.forEach((f,i)=>{const x=x0+(i%cols)*cw+45,y=y0+Math.floor(i/cols)*ch,hit=t>0.5+i*0.22;
   g.fillStyle=hit?'#3A1219':'#18202B';g.strokeStyle=hit?'#FF4D5E':'#3A4555';g.lineWidth=4;
   g.beginPath();g.moveTo(x,y);g.lineTo(x+100,y);g.lineTo(x+140,y+40);g.lineTo(x+140,y+120);g.lineTo(x,y+120);g.closePath();g.fill();g.stroke();
   if(hit){g.fillStyle='#FF4D5E';rr(g,x+50,y+48,40,32,6);g.fill();g.strokeStyle='#FF4D5E';g.lineWidth=6;g.beginPath();g.arc(x+70,y+48,13,Math.PI,0);g.stroke()}
   txt(g,hit?f.split('.')[0]+'.locked':f,x+70,y+150,20,hit?'#FF9AA5':'#8A94A6',500,MONO)});
  if(t>4){const p=ease((t-4)/0.4),sec=Math.max(0,259199-Math.floor((t-4)*1));g.globalAlpha=p;
   g.fillStyle='rgba(255,77,94,.95)';rr(g,90,640,900,150,20);g.fill();
   txt(g,d.banner,540,705,40,'#fff',900,MONO);
   const hh=String(Math.floor(sec/3600)).padStart(2,'0'),mm=String(Math.floor(sec/60)%60).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');
   txt(g,`${hh}:${mm}:${ss}`,540,765,40,'#fff',700,MONO);g.globalAlpha=1}
 },
 otp(g,t,d,h){ // MFA code on phone + shield
  grid(g,h);glow(g,540,450,520,'rgba(43,255,136,.14)');
  const s=phone(g,540,450);
  txt(g,d.app,s.cx,s.y+130,28,'#8A94A6',500);txt(g,'인증번호',s.cx,s.y+200,40,'#fff',900);
  const code=d.code,n=Math.floor(clamp((t-0.6)/1.8)*code.length);
  for(let i=0;i<6;i++){const x=s.x+22+i*46;g.strokeStyle=i<n?ACC:'#3A4555';g.lineWidth=4;rr(g,x,s.y+250,38,56,8);g.stroke();
   if(i<n)txt(g,code[i],x+19,s.y+292,34,'#fff',900,MONO)}
  // toggle
  const on=t>2.8,p=ease((t-2.8)/0.3);txt(g,'2단계 인증',s.x+30,s.y+420,28,'#C9D1DC',700,FONT,'left');
  g.fillStyle=on?ACC:'#3A4555';rr(g,s.x+s.w-120,s.y+390,90,46,23);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s.x+s.w-97+44*p,s.y+413,18,0,7);g.fill();
  if(t>3.2){const q=ease((t-3.2)/0.5),sc=0.6+0.4*q;g.save();g.translate(800,250);g.scale(sc,sc);g.globalAlpha=q;
   g.fillStyle=ACC;g.beginPath();g.moveTo(0,-110);g.lineTo(95,-70);g.lineTo(95,10);g.quadraticCurveTo(95,90,0,130);g.quadraticCurveTo(-95,90,-95,10);g.lineTo(-95,-70);g.closePath();g.fill();
   g.strokeStyle='#0A0E14';g.lineWidth=18;g.lineCap='round';g.beginPath();g.moveTo(-40,5);g.lineTo(-8,38);g.lineTo(48,-28);g.stroke();g.restore()}
 },
 breach(g,t,d,h){ // AI bot hits institutions one by one
  grid(g,h);glow(g,540,330,520,'rgba(255,77,94,.12)');
  const bx=540,by=200,nodes=d.nodes,cols=3,cw=300,ch=150,x0=540-cols*cw/2,y0=430;
  // links
  nodes.forEach((n,i)=>{const x=x0+(i%cols)*cw+cw/2,y=y0+Math.floor(i/cols)*(ch+40)+ch/2,t0=0.6+i*0.45,p=ease((t-t0)/0.35);
   if(p<=0)return;g.strokeStyle='rgba(255,77,94,.7)';g.lineWidth=4;g.setLineDash([12,10]);g.lineDashOffset=-t*40;
   g.beginPath();g.moveTo(bx,by+70);g.lineTo(bx+(x-bx)*p,by+70+(y-ch/2-by-70)*p);g.stroke();g.setLineDash([])});
  // bot
  const pu=1+0.04*Math.sin(t*5);g.save();g.translate(bx,by);g.scale(pu,pu);
  g.strokeStyle='#FF4D5E';g.lineWidth=6;g.beginPath();g.moveTo(0,-95);g.lineTo(0,-70);g.stroke();g.fillStyle='#FF4D5E';g.beginPath();g.arc(0,-100,10,0,7);g.fill();
  g.fillStyle='#1B2330';g.strokeStyle='#FF4D5E';g.lineWidth=6;rr(g,-110,-70,220,140,32);g.fill();g.stroke();
  const blink=(t%2.4)>2.25?3:22;g.fillStyle='#FF4D5E';rr(g,-62,-blink/2-5,40,blink,8);g.fill();rr(g,22,-blink/2-5,40,blink,8);g.fill();
  txt(g,d.bot||'AI',0,55,26,'#FF9AA5',700,MONO);g.restore();
  // institution cards
  nodes.forEach((n,i)=>{const x=x0+(i%cols)*cw+15,y=y0+Math.floor(i/cols)*(ch+40),hit=t>1.0+i*0.45,q=ease((t-1.0-i*0.45)/0.25);
   g.fillStyle=hit?'#3A1219':'#141B24';g.strokeStyle=hit?'#FF4D5E':'#2E3947';g.lineWidth=4;rr(g,x,y,cw-30,ch,20);g.fill();g.stroke();
   txt(g,n[0],x+(cw-30)/2,y+62,34,hit?'#fff':'#8A94A6',900);
   if(hit){g.globalAlpha=q;txt(g,n[1],x+(cw-30)/2,y+112,26,'#FF9AA5',700,MONO);g.globalAlpha=1}});
  const k=nodes.filter((n,i)=>t>1.0+i*0.45).length;
  txt(g,`${d.label} ${k}/${nodes.length}`,60,90,30,k?'#FF4D5E':'#8A94A6',700,MONO,'left');
 },
 dual(g,t,d,h){ // dual-use: tool flips from defense (green) to attack (red)
  const cy=380,flip=ease((t-2.4)/0.6),red=flip>0.5;
  bgPro(g,h,red?'rgba(255,77,94,.07)':'rgba(43,255,136,.06)');
  // left: shield (defense)
  const L=230,Rx=850,a1=ease((t-0.3)/0.8);
  g.globalAlpha=red?0.35:1;g.strokeStyle=ACC;g.lineWidth=8;g.beginPath();g.moveTo(L,cy-90);g.lineTo(L+75,cy-60);g.lineTo(L+75,cy+5);g.quadraticCurveTo(L+75,cy+70,L,cy+100);g.quadraticCurveTo(L-75,cy+70,L-75,cy+5);g.lineTo(L-75,cy-60);g.closePath();g.stroke();
  g.lineCap='round';g.beginPath();g.moveTo(L-30,cy+5);g.lineTo(L-6,cy+30);g.lineTo(L+36,cy-22);g.stroke();g.lineCap='butt';
  txt(g,d.left||'보안 점검',L,cy+160,34,ACC,700);g.globalAlpha=1;
  // right: crosshair (attack)
  g.globalAlpha=red?1:0.3;g.strokeStyle=RED;g.lineWidth=8;g.beginPath();g.arc(Rx,cy,80,0,7);g.stroke();g.beginPath();g.arc(Rx,cy,30,0,7);g.stroke();
  g.beginPath();g.moveTo(Rx,cy-115);g.lineTo(Rx,cy-55);g.moveTo(Rx,cy+55);g.lineTo(Rx,cy+115);g.moveTo(Rx-115,cy);g.lineTo(Rx-55,cy);g.moveTo(Rx+55,cy);g.lineTo(Rx+115,cy);g.stroke();
  txt(g,d.right||'해킹 도구',Rx,cy+160,34,RED,700);g.globalAlpha=1;
  // links

 photo(g,t,d,h){ // AI background image: slow seamless zoom/pan + light sweep + particles (text stays in HTML/code)

// ---------- slide builders ----------
const CAT={NEWS:'#2BFF88',CVE:'#FF4D5E',TREND:'#FF8A3D',TIPS:'#FFC83D',WEEKLY:'#5AB0FF',WORDS:'#B48CFF'};
const DATED=['NEWS','CVE','WEEKLY']; // time-sensitive -> date, evergreen -> series no.
function logTag(s){ // log-line style: [NEWS] 2026-10-05 / [TIPS] #012
 const cat=(s.cat||s.tag.split('|').pop()).trim().toUpperCase();
 const no=s.no||(s.data&&s.data.no)||1;
 const right=DATED.includes(cat)?(s.date||new Date().toISOString().slice(0,10)):'#'+String(no).padStart(3,'0');
 return `<b style="color:${CAT[cat]||'#2BFF88'}">[${cat}]</b>${right}`;
}
function build(s,meta){
 const el=document.getElementById('slide');
 if(s.type==='cover'){
  el.className='cover';
  const cc=(s.cat||(s.tag||'').split('|').pop()||'').trim().toUpperCase();BGT=THEME[cc]||null;
  if(BGT){el.style.setProperty('--bg',BGT.a);el.style.setProperty('--bgs',hx(BGT.a,.92));el.style.setProperty('--cat',CAT[cc])}
  ctx=mkCanvas(1350);
  el.insertAdjacentHTML('beforeend',`<div class="shade"></div><div class="tag">${logTag(s)}</div><h1>${hl(s.title)}</h1><div class="logo">${meta.logo}</div>`);
  draw=t=>ANIM[s.anim](ctx,t,s.data||{},1350);
 } else if(s.type==='content'){
  el.insertAdjacentHTML('beforeend',`<div class="media"></div><div class="badge">${s.n}</div><div class="text"><h1>${s.title}</h1><p>${hl(s.body)}</p></div>`);
  ctx=mkCanvas(MH);ctx.canvas.style.top='27px';
  draw=t=>ANIM[s.anim](ctx,t,s.data||{},MH);
 } else if(s.type==='summary'){
  el.className='plain';
  el.innerHTML=`<div class="gridv"></div>
   <div class="center" style="top:110px"><div style="font-size:30px;font-weight:700;color:var(--acc-ink);letter-spacing:2px">${s.kicker}</div><div style="font-size:64px;font-weight:900;margin-top:14px;letter-spacing:-1.5px">${s.title}</div></div>
   <div class="center" style="top:330px"><ul class="card sum">${s.points.map((p,i)=>`<li><span>${i+1}</span>${hl(p)}</li>`).join('')}</ul></div>
   <div class="center src" style="top:1090px">${s.source}</div>
   <div class="center" style="bottom:56px;font-weight:900;font-size:28px;letter-spacing:4px">${meta.logo}</div>`;
 } else if(s.type==='follow'){
  el.className='plain';
  el.innerHTML=`<div class="gridv"></div>
   <div class="center" style="top:150px;font-size:54px;font-weight:700;line-height:1.45;color:#1F3A5F">${s.title.replace(/\n/g,'<br>')}</div>
   <div class="center" style="top:430px"><div class="card" style="display:flex;align-items:center;gap:32px;padding:36px 44px">
    <div style="width:120px;height:120px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:var(--acc)">${meta.mark}</div>
    <div style="flex:1"><div style="font-size:40px;font-weight:700">${meta.handle}</div><div style="font-size:26px;color:#7A818B;margin-top:6px">${meta.bio}</div></div>
    <div class="btn" style="font-size:34px;padding:22px 48px">팔로우</div></div></div>
   <div class="center" style="top:720px;font-size:32px;color:#4A5563;line-height:1.7">${s.sub.replace(/\n/g,'<br>')}</div>
   <div class="center" style="bottom:56px;font-weight:900;font-size:28px;letter-spacing:4px">${meta.logo}</div>`;
 }
}
window.setup=async(s,meta)=>{const src=s.data&&s.data.src;if(src){PIMG=new Image();PIMG.src=src;await PIMG.decode().catch(()=>{PIMG=null})}build(s,meta);window.render(0)};
window.render=t=>draw(t);
</script></body></html>
